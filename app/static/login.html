<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · CRUD System</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="login-brand">
        <div class="brand-mark">C</div>
        <h1>다시 오신 것을 환영합니다</h1>
        <p class="intro">CRUD System 대시보드를 이용하려면 계정으로 로그인하세요.</p>
      </div>
      <form id="login-form">
        <div class="form-grid">
          <div class="field">
            <label for="username">아이디</label>
            <input id="username" name="username" placeholder="아이디 입력" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" placeholder="비밀번호 입력" type="password" autocomplete="current-password" required>
          </div>
        </div>
        <p id="error" class="error-text" role="alert"></p>
        <button class="btn btn-primary" type="submit">로그인</button>
      </form>
      <p class="login-hint">초기 로그인 계정은 README와 .env 설정을 확인하세요.</p>
      <p class="auth-switch">계정이 없으신가요? <a href="/register">회원가입</a></p>
    </section>
  </main>
  <script>
    const form = document.querySelector('#login-form');
    const error = document.querySelector('#error');
    fetch('/api/auth/me').then(r => { if (r.ok) location.replace('/member'); });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      const button = form.querySelector('button');
      button.disabled = true;
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            username: form.username.value.trim(),
            password: form.password.value
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || '로그인에 실패했습니다.');
        location.replace('/member');
      } catch (err) {
        error.textContent = err.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
