services:
  mydb-svc:
    image: hifrodo/crud-db:1.0
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-frodo}
      MYSQL_USER: ${MYSQL_USER:-frodo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Frodo5020!!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_EXPOSED_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    image: hifrodo/crud-app:1.0
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    depends_on:
      mydb-svc:
        condition: service_healthy
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mydb-svc}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-frodo}
      MYSQL_USER: ${MYSQL_USER:-frodo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Frodo5020!!}
      SERVER_IP: ${SERVER_IP:-}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-frodo1234}
    ports:
      - "${WEB_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
